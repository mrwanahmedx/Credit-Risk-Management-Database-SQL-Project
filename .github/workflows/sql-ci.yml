name: SQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Build schema and seed data
        run: sqlite3 credit_risk_ci.db < database.sql
      - name: Run data-quality and reconciliation pack
        run: sqlite3 credit_risk_ci.db < data_quality_checks.sql
      - name: Run engineered analytical queries
        run: sqlite3 credit_risk_ci.db < sample_queries.sql
